<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS &amp; PHP/MySQL Reviewer</title>
  <style>
    :root {
      --bg:#0f172a; --surface:#1e293b; --card:#263349; --border:#334155;
      --primary:#3b82f6; --success:#22c55e; --danger:#ef4444;
      --warning:#f59e0b; --text:#f1f5f9; --muted:#94a3b8; --radius:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

    /* HEADER */
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;
      display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;}
    .brand{font-weight:700;font-size:16px;color:var(--primary);white-space:nowrap;}
    .bank-badge{background:var(--card);border:1px solid var(--border);padding:4px 12px;
      border-radius:20px;font-size:12px;color:var(--muted);}
    .hcontrols{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

    /* BUTTONS */
    .btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;
      font-weight:600;transition:all .18s;white-space:nowrap;color:#fff;}
    .btn:hover{filter:brightness(1.15);transform:translateY(-1px);}
    .btn:active{transform:translateY(0);}
    .btn-primary  {background:var(--primary);}
    .btn-secondary{background:var(--card);border:1px solid var(--border);}
    .btn-success  {background:#16a34a;}
    .btn-danger   {background:var(--danger);}
    .btn-warning  {background:#b45309;}
    .btn-sm{padding:6px 12px;font-size:12px;}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none;}

    /* SCREENS — hidden by default, shown with .active */
    .screen{display:none;}
    .screen.active{display:block;}

    main{max-width:900px;margin:0 auto;padding:20px 16px 40px;}

    /* PROGRESS */
    .progress-wrap{margin-bottom:10px;}
    .progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;}
    .progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#818cf8);border-radius:4px;transition:width .3s;}
    .answered-count{font-size:12px;color:var(--muted);text-align:right;margin-bottom:12px;}
    .answered-count span{color:var(--primary);font-weight:700;}

    /* QUESTION CARD */
    .question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:18px;}
    .question-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .question-text{font-size:17px;line-height:1.6;margin-bottom:22px;color:#fff;}
    .question-text code{background:#0f172a;border:1px solid var(--border);padding:2px 7px;
      border-radius:5px;font-family:'Courier New',monospace;font-size:14px;color:#7dd3fc;}

    /* CHOICES */
    .choices{display:flex;flex-direction:column;gap:10px;}
    .choice{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-radius:10px;
      border:2px solid var(--border);background:var(--card);cursor:pointer;
      transition:all .15s;text-align:left;width:100%;color:#fff;}
    .choice:hover:not(.locked){border-color:var(--primary);background:#1d3557;}
    .choice.selected {border-color:var(--primary);background:#1e3a8a44;}
    .choice.correct  {border-color:var(--success);background:#14532d55;}
    .choice.incorrect{border-color:var(--danger); background:#7f1d1d55;}
    .choice.missed   {border-color:var(--success);background:#14532d33;}
    .choice-letter{min-width:32px;height:32px;background:var(--border);border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
      flex-shrink:0;color:#fff;}
    .choice.selected  .choice-letter{background:var(--primary);}
    .choice.correct   .choice-letter{background:var(--success);}
    .choice.incorrect .choice-letter{background:var(--danger);}
    .choice.missed    .choice-letter{background:var(--success);}
    .choice-text{font-size:14px;line-height:1.5;padding-top:5px;color:#fff;flex:1;}
    .choice-label{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;
      margin-left:auto;flex-shrink:0;align-self:center;white-space:nowrap;}
    .label-correct  {background:var(--success);color:#fff;}
    .label-incorrect{background:var(--danger); color:#fff;}
    .label-missed   {background:#166534;color:#bbf7d0;}

    /* NAV CONTROLS */
    .nav-controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;}

    /* NAVIGATOR */
    .navigator{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:24px;}
    .navigator h4{font-size:13px;color:var(--muted);margin-bottom:12px;}
    .nav-grid{display:flex;flex-wrap:wrap;gap:6px;}
    .nav-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);
      background:var(--card);color:var(--muted);font-size:12px;font-weight:600;
      cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
    .nav-btn:hover{border-color:var(--primary);color:var(--text);}
    .nav-btn.answered{background:var(--primary);border-color:var(--primary);color:#fff;}
    .nav-btn.current {border-color:var(--warning);color:var(--warning);}
    .nav-btn.answered.current{border-color:var(--warning);}

    /* RESULT SCREEN */
    .scorecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:36px;text-align:center;margin-bottom:24px;}
    .verdict-badge{display:inline-block;padding:8px 32px;border-radius:30px;font-size:22px;
      font-weight:800;letter-spacing:3px;margin-bottom:16px;}
    .verdict-passed{background:#14532d;color:#86efac;}
    .verdict-failed{background:#7f1d1d;color:#fca5a5;}
    .score-big{font-size:64px;font-weight:800;line-height:1;}
    .score-pct{font-size:28px;color:var(--muted);margin-top:4px;}
    .score-details{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
    .score-stat{text-align:center;}
    .score-stat .val{font-size:28px;font-weight:700;}
    .score-stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
    .result-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
    .passing-note{font-size:13px;color:var(--muted);margin-top:12px;}

    /* REVIEW SCREEN */
    .review-item{background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:22px;margin-bottom:16px;}
    .review-q{font-size:15px;margin-bottom:14px;line-height:1.6;color:#fff;}
    .review-q code{background:#0f172a;border:1px solid var(--border);padding:2px 7px;
      border-radius:5px;font-family:'Courier New',monospace;font-size:13px;color:#7dd3fc;}
    .review-choices{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
    .review-choice{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;
      border-radius:8px;border:1.5px solid var(--border);background:var(--card);
      font-size:13px;color:#fff;}
    .review-choice.rc-correct  {border-color:var(--success);background:#14532d44;}
    .review-choice.rc-incorrect{border-color:var(--danger); background:#7f1d1d44;}
    .rc-letter{min-width:26px;height:26px;border-radius:50%;background:var(--border);
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
      flex-shrink:0;color:#fff;}
    .review-choice.rc-correct   .rc-letter{background:var(--success);}
    .review-choice.rc-incorrect .rc-letter{background:var(--danger);}
    .rc-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
      margin-left:auto;align-self:center;white-space:nowrap;}
    .rc-tag-correct  {background:var(--success);color:#fff;}
    .rc-tag-incorrect{background:var(--danger); color:#fff;}
    .rc-tag-answer   {background:#1d4ed8;color:#fff;}
    .review-verdict{display:inline-block;padding:3px 12px;border-radius:20px;
      font-size:12px;font-weight:700;margin-bottom:10px;}
    .rv-correct  {background:#14532d;color:#86efac;}
    .rv-incorrect{background:#7f1d1d;color:#fca5a5;}
    .review-explanation{font-size:13px;color:var(--muted);padding:10px 14px;
      background:#1e293b;border-radius:8px;border-left:3px solid var(--primary);line-height:1.5;}
    .back-top{text-align:center;margin-top:20px;}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
      z-index:999;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.active{display:flex;}
    .modal-box{background:#1e293b;border:1px solid #475569;border-radius:16px;
      padding:32px;max-width:460px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.7);text-align:center;}
    .modal-icon{font-size:48px;margin-bottom:12px;}
    .modal-title{font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:8px;}
    .modal-body{font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:24px;}
    .modal-body strong{color:#f1f5f9;}
    .modal-body .answered-ok{color:#86efac;font-weight:700;}
    .modal-body .not-answered{color:#fca5a5;font-weight:700;}
    .modal-footer{display:flex;gap:12px;justify-content:center;}
    .modal-footer .btn{padding:12px 32px;font-size:15px;font-weight:700;border-radius:10px;}
    .btn-yes{background:#16a34a;}
    .btn-yes:hover{background:#15803d;}
    .btn-no{background:#475569;}
    .btn-no:hover{background:#334155;}

    @media(max-width:600px){
      header{flex-direction:column;align-items:flex-start;}
      .score-big{font-size:48px;}
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <span class="brand">JS &amp; PHP/MySQL Reviewer</span>
    <span class="bank-badge" id="bank-badge">Bank A</span>
  </div>
  <div class="hcontrols">
    <button class="btn btn-secondary btn-sm" onclick="shuffleQuestions()">Shuffle Questions</button>
    <button class="btn btn-secondary btn-sm" onclick="shuffleChoices()">Shuffle Choices</button>
    <button class="btn btn-warning   btn-sm" onclick="shuffleAll()">Shuffle All</button>
    <button class="btn btn-success   btn-sm" onclick="newReviewer()">New Reviewer</button>
    <button class="btn btn-primary   btn-sm" onclick="changeQuestions()">Change Questions</button>
  </div>
</header>

<main>

  <!-- ═══════════════ EXAM SCREEN ═══════════════ -->
  <div id="exam-screen" class="screen active">

    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">Question 1 of 80</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div class="answered-count">Answered: <span id="answered-count">0</span> / 80</div>

    <div class="question-card">
      <div class="question-meta" id="q-meta">JavaScript Advanced &middot; Question 1</div>
      <div class="question-text" id="q-text">Loading...</div>
      <div class="choices" id="choices-wrap"></div>
    </div>

    <div class="nav-controls">
      <button class="btn btn-secondary" id="btn-prev" onclick="navigate(-1)">&#8592; Previous</button>
      <button class="btn btn-primary"   id="btn-next" onclick="navigate(1)">Next &#8594;</button>
      <button class="btn btn-danger"    onclick="submitExam()">Submit Exam</button>
    </div>

    <div class="navigator">
      <h4>QUESTION NAVIGATOR &mdash; click any number to jump</h4>
      <div class="nav-grid" id="nav-grid"></div>
    </div>
  </div>

  <!-- ═══════════════ RESULT SCREEN ═══════════════ -->
  <div id="result-screen" class="screen">
    <div class="scorecard">
      <div class="verdict-badge" id="verdict-badge">PASSED</div>
      <div class="score-big"     id="score-big">0</div>
      <div class="score-pct"     id="score-pct">0%</div>
      <div style="color:var(--muted);font-size:14px;margin-top:6px;">out of 80 questions</div>
      <div class="passing-note"  id="passing-note">Passing score: 60 / 80 (75%)</div>
      <div class="score-details">
        <div class="score-stat"><div class="val" id="stat-correct" style="color:var(--success)">0</div><div class="lbl">Correct</div></div>
        <div class="score-stat"><div class="val" id="stat-wrong"   style="color:var(--danger)">0</div><div class="lbl">Wrong</div></div>
        <div class="score-stat"><div class="val" id="stat-pct"     style="color:var(--primary)">0%</div><div class="lbl">Score</div></div>
      </div>
    </div>
    <div class="result-controls">
      <button class="btn btn-primary"   onclick="showReview()">Review Answers</button>
      <button class="btn btn-warning"   onclick="retakeExam()">Retake Exam</button>
      <button class="btn btn-success"   onclick="newReviewer()">New Reviewer</button>
      <button class="btn btn-secondary" onclick="shuffleAll()">Shuffle All</button>
    </div>
  </div>

  <!-- ═══════════════ REVIEW SCREEN ═══════════════ -->
  <div id="review-screen" class="screen">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <button class="btn btn-secondary" onclick="showScreen('result')">&#8592; Back to Score</button>
      <button class="btn btn-warning"   onclick="retakeExam()">Retake Exam</button>
      <button class="btn btn-success"   onclick="newReviewer()">New Reviewer</button>
    </div>
    <div id="review-list"></div>
    <div class="back-top"><button class="btn btn-secondary" onclick="scrollTo(0,0)">&#8593; Back to Top</button></div>
  </div>

</main>

<!-- MODAL: confirm submit -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-icon">&#9888;&#65039;</div>
    <div class="modal-title" id="modal-title">Submit Exam?</div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-no"  onclick="closeModal()">No, Go Back</button>
      <button class="btn btn-yes" onclick="confirmSubmit()">Yes, Submit</button>
    </div>
  </div>
</div>

<script src="questions-bank-a.js"></script>
<script src="questions-bank-b.js"></script>
<script src="questions-bank-c.js"></script>

<script>
/* ─── CONSTANTS ─────────────────────────────────────────────── */
const BANKS      = [BANK_A, BANK_B, BANK_C];
const BANK_NAMES = ['Bank A', 'Bank B', 'Bank C'];
const PASS_PCT   = 75;
const LETTERS    = ['A','B','C','D'];

/* ─── STATE ─────────────────────────────────────────────────── */
let state = {
  bankIndex: 0,
  questions: [],
  current:   0,
  answers:   {},
  submitted: false
};

/* ─── SCREEN SWITCHER ───────────────────────────────────────── */
function showScreen(name) {
  ['exam-screen','result-screen','review-screen'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active');
  });
  document.getElementById(name + '-screen').classList.add('active');
  window.scrollTo(0, 0);
}

/* ─── UTILS ─────────────────────────────────────────────────── */
function fisherYates(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* ─── INIT ──────────────────────────────────────────────────── */
function init(bankIdx, doShuffleQ, doShuffleC) {
  state.bankIndex = bankIdx;
  state.current   = 0;
  state.answers   = {};
  state.submitted = false;
  state.questions = deepClone(BANKS[bankIdx]);
  if (doShuffleQ) fisherYates(state.questions);
  if (doShuffleC) state.questions.forEach(q => fisherYates(q.choices));
  document.getElementById('bank-badge').textContent = BANK_NAMES[bankIdx];
  showScreen('exam');
  buildNavigator();
  render();
  saveLS();
}

/* ─── RENDER ────────────────────────────────────────────────── */
function render() {
  const q     = state.questions[state.current];
  const idx   = state.current;
  const total = state.questions.length;
  const answeredCount = Object.keys(state.answers).length;

  // Progress
  const pct = Math.round((idx / total) * 100);
  document.getElementById('progress-text').textContent  = `Question ${idx + 1} of ${total}`;
  document.getElementById('progress-pct').textContent   = `${pct}%`;
  document.getElementById('progress-fill').style.width  = `${pct}%`;
  document.getElementById('answered-count').textContent = answeredCount;

  // Meta
  const section = idx < 40 ? 'JavaScript Advanced' : 'PHP & MySQL Integration';
  document.getElementById('q-meta').textContent = `${section}  ·  Question ${idx + 1}`;
  document.getElementById('q-text').innerHTML   = q.question;

  // Choices
  const wrap     = document.getElementById('choices-wrap');
  wrap.innerHTML = '';
  const selected = state.answers[q.id];

  q.choices.forEach((c, ci) => {
    const btn = document.createElement('button');
    btn.className = 'choice';

    const ltr  = document.createElement('span');
    ltr.className   = 'choice-letter';
    ltr.textContent = LETTERS[ci];

    const txt  = document.createElement('span');
    txt.className   = 'choice-text';
    txt.textContent = c.text;

    btn.appendChild(ltr);
    btn.appendChild(txt);

    if (state.submitted) {
      btn.classList.add('locked');
      const isCorrect  = c.id === q.correctChoiceId;
      const isSelected = c.id === selected;
      const lbl = document.createElement('span');
      lbl.className = 'choice-label';

      if (isCorrect && isSelected) {
        btn.classList.add('correct');
        lbl.classList.add('label-correct');
        lbl.textContent = 'Correct';
        btn.appendChild(lbl);
      } else if (!isCorrect && isSelected) {
        btn.classList.add('incorrect');
        lbl.classList.add('label-incorrect');
        lbl.textContent = 'Your Answer';
        btn.appendChild(lbl);
      } else if (isCorrect && !isSelected) {
        btn.classList.add('missed');
        lbl.classList.add('label-missed');
        lbl.textContent = 'Correct Answer';
        btn.appendChild(lbl);
      }
    } else {
      if (c.id === selected) btn.classList.add('selected');
      btn.onclick = () => selectAnswer(q.id, c.id);
    }

    wrap.appendChild(btn);
  });

  // Prev button
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total - 1;

  updateNavigator();
}

/* ─── SELECT ANSWER ─────────────────────────────────────────── */
function selectAnswer(qId, cId) {
  if (state.submitted) return;
  state.answers[qId] = cId;
  render();
  saveLS();
}

/* ─── NAVIGATE ──────────────────────────────────────────────── */
function navigate(dir) {
  const next = state.current + dir;
  if (next < 0 || next >= state.questions.length) return;
  state.current = next;
  render();
}

function jumpTo(idx) {
  state.current = idx;
  closeModal();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ─── NAVIGATOR ─────────────────────────────────────────────── */
function buildNavigator() {
  const grid = document.getElementById('nav-grid');
  grid.innerHTML = '';
  state.questions.forEach((q, i) => {
    const b = document.createElement('button');
    b.className   = 'nav-btn';
    b.textContent = i + 1;
    b.id          = `nav-${i}`;
    b.onclick     = () => jumpTo(i);
    grid.appendChild(b);
  });
  updateNavigator();
}

function updateNavigator() {
  state.questions.forEach((q, i) => {
    const b = document.getElementById(`nav-${i}`);
    if (!b) return;
    b.className = 'nav-btn';
    if (state.answers[q.id]) b.classList.add('answered');
    if (i === state.current)  b.classList.add('current');
  });
}

/* ─── MODAL ─────────────────────────────────────────────────── */
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

/* ─── SUBMIT ────────────────────────────────────────────────── */
function submitExam() {
  const total      = state.questions.length;
  const answered   = Object.keys(state.answers).length;
  const unanswered = total - answered;

  // Build confirm message
  let bodyHTML = `
    <strong>${answered}</strong> out of <strong>${total}</strong> questions answered.<br>`;

  if (unanswered === 0) {
    bodyHTML += `<span class="answered-ok">All questions answered!</span><br><br>
    Are you sure you want to submit your exam?`;
  } else {
    bodyHTML += `<span class="not-answered">${unanswered} question(s) left unanswered.</span><br><br>
    Unanswered questions will be marked as <strong>Wrong</strong>.<br>
    Do you still want to submit?`;
  }

  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-overlay').classList.add('active');
}

function confirmSubmit() {
  closeModal();
  state.submitted = true;

  let correct = 0;
  state.questions.forEach(q => {
    if (state.answers[q.id] === q.correctChoiceId) correct++;
  });

  const wrong  = state.questions.length - correct;
  const pct    = Math.round((correct / state.questions.length) * 100);
  const passed = pct >= PASS_PCT;

  document.getElementById('score-big').textContent    = correct;
  document.getElementById('score-pct').textContent    = pct + '%';
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent   = wrong;
  document.getElementById('stat-pct').textContent     = pct + '%';
  document.getElementById('score-big').style.color    = passed ? 'var(--success)' : 'var(--danger)';

  const badge = document.getElementById('verdict-badge');
  badge.textContent = passed ? 'PASSED' : 'FAILED';
  badge.className   = 'verdict-badge ' + (passed ? 'verdict-passed' : 'verdict-failed');

  document.getElementById('passing-note').textContent =
    `Passing score: ${Math.ceil(state.questions.length * PASS_PCT / 100)} / ${state.questions.length} (${PASS_PCT}%)`;

  localStorage.removeItem('reviewer_state');
  showScreen('result');
}

/* ─── REVIEW ────────────────────────────────────────────────── */
function showReview() {
  const list = document.getElementById('review-list');
  list.innerHTML = '';

  state.questions.forEach((q, i) => {
    const userChoiceId = state.answers[q.id];
    const isCorrect    = userChoiceId === q.correctChoiceId;

    const div = document.createElement('div');
    div.className = 'review-item';

    // Number
    const num = document.createElement('div');
    num.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
    num.textContent = `Question ${i + 1}`;
    div.appendChild(num);

    // Question
    const qEl = document.createElement('div');
    qEl.className = 'review-q';
    qEl.innerHTML = q.question;
    div.appendChild(qEl);

    // Verdict
    const vEl = document.createElement('div');
    vEl.className   = `review-verdict ${isCorrect ? 'rv-correct' : 'rv-incorrect'}`;
    vEl.textContent = isCorrect ? 'CORRECT' : 'INCORRECT';
    div.appendChild(vEl);

    // All choices
    const cWrap = document.createElement('div');
    cWrap.className = 'review-choices';

    q.choices.forEach((c, ci) => {
      const isThisCorrect  = c.id === q.correctChoiceId;
      const isThisSelected = c.id === userChoiceId;

      const row = document.createElement('div');
      row.className = 'review-choice';
      if (isThisCorrect)   row.classList.add('rc-correct');
      if (!isThisCorrect && isThisSelected) {
        row.classList.remove('rc-correct');
        row.classList.add('rc-incorrect');
      }

      const ltr = document.createElement('span');
      ltr.className   = 'rc-letter';
      ltr.textContent = LETTERS[ci];

      const txt = document.createElement('span');
      txt.style.flex  = '1';
      txt.textContent = c.text;

      row.appendChild(ltr);
      row.appendChild(txt);

      // Tag
      const tag = document.createElement('span');
      tag.className = 'rc-tag';
      if (isThisCorrect && isThisSelected) {
        tag.classList.add('rc-tag-correct');
        tag.textContent = 'Correct';
        row.appendChild(tag);
      } else if (!isThisCorrect && isThisSelected) {
        tag.classList.add('rc-tag-incorrect');
        tag.textContent = 'Your Answer';
        row.appendChild(tag);
      } else if (isThisCorrect && !isThisSelected) {
        tag.classList.add('rc-tag-answer');
        tag.textContent = 'Correct Answer';
        row.appendChild(tag);
      }

      cWrap.appendChild(row);
    });

    div.appendChild(cWrap);

    // Explanation
    const exp = document.createElement('div');
    exp.className   = 'review-explanation';
    exp.textContent = q.explanation;
    div.appendChild(exp);

    list.appendChild(div);
  });

  showScreen('review');
}

/* ─── SHUFFLE / NEW ─────────────────────────────────────────── */
function shuffleQuestions() {
  fisherYates(state.questions);
  state.current = 0; state.answers = {}; state.submitted = false;
  showScreen('exam'); buildNavigator(); render(); saveLS();
}
function shuffleChoices() {
  state.questions.forEach(q => fisherYates(q.choices));
  state.current = 0; state.answers = {}; state.submitted = false;
  showScreen('exam'); buildNavigator(); render(); saveLS();
}
function shuffleAll() {
  fisherYates(state.questions);
  state.questions.forEach(q => fisherYates(q.choices));
  state.current = 0; state.answers = {}; state.submitted = false;
  showScreen('exam'); buildNavigator(); render(); saveLS();
}
function newReviewer() {
  init((state.bankIndex + 1) % BANKS.length, true, true);
}
function changeQuestions() {
  const opts = [0,1,2].filter(i => i !== state.bankIndex);
  init(opts[Math.floor(Math.random() * opts.length)], true, true);
}
function retakeExam() {
  state.current = 0; state.answers = {}; state.submitted = false;
  showScreen('exam'); buildNavigator(); render(); saveLS();
}

/* ─── LOCAL STORAGE ─────────────────────────────────────────── */
function saveLS() {
  try {
    localStorage.setItem('reviewer_state', JSON.stringify({
      bankIndex: state.bankIndex,
      questions: state.questions,
      current:   state.current,
      answers:   state.answers
    }));
  } catch(e) {}
}
function loadLS() {
  try {
    const raw = localStorage.getItem('reviewer_state');
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.questions || s.questions.length !== 80) return false;
    state.bankIndex = s.bankIndex;
    state.questions = s.questions;
    state.current   = s.current || 0;
    state.answers   = s.answers || {};
    state.submitted = false;
    document.getElementById('bank-badge').textContent = BANK_NAMES[s.bankIndex];
    showScreen('exam');
    buildNavigator();
    render();
    return true;
  } catch(e) { return false; }
}

/* ─── BOOT ──────────────────────────────────────────────────── */
(function boot() {
  if (!loadLS()) init(0, false, false);
})();
</script>
